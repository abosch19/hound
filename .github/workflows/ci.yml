name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Tesseract (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      - run: uv pip install -e ".[dev]"
      - name: Tests
        env:
          HOUND_WIN_ACL_TESTS: "1"   # en Windows crea usuarios locales y ACL reales
        run: python -m pytest -v

  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Instalar con install.ps1 (desde el código del commit)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force C:\Compartido\Obras | Out-Null
          Set-Content C:\Compartido\Obras\presupuesto.txt "Presupuesto de la reforma de la cocina"
          .\install.ps1 -SharePath C:\Compartido -Source $PWD -AllowFrom 10.8.0.0/24
      - name: Comprobar el servicio y el MCP
        shell: powershell
        run: |
          $env:Path += ";$env:ProgramFiles\Hound\bin"
          $env:HOUND_CONFIG = "$env:ProgramData\Hound\config.toml"
          if ((Get-Service Hound).Status -ne "Running") { throw "El servicio no está en marcha" }
          Start-Sleep -Seconds 60
          hound status
          $out = hound token create runneradmin --label ci
          $token = ($out | Select-String -Pattern 'hound_[A-Za-z0-9_-]+').Matches[0].Value
          $headers = @{ Authorization = "Bearer $token"; Accept = "application/json, text/event-stream"; "MCP-Protocol-Version" = "2025-06-18" }
          $body = '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"search_files","arguments":{"query":"reforma de la cocina"}}}'
          $r = Invoke-RestMethod -Uri http://localhost:8765/mcp -Method Post -Headers $headers -Body $body -ContentType "application/json"
          $r | ConvertTo-Json -Depth 10
          if (($r | ConvertTo-Json -Depth 10) -notmatch "presupuesto.txt") { throw "La búsqueda no encontró el fichero" }
          $body = '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"index_status","arguments":{}}}'
          $r = Invoke-RestMethod -Uri http://localhost:8765/mcp -Method Post -Headers $headers -Body $body -ContentType "application/json"
          $r | ConvertTo-Json -Depth 10
          if (($r | ConvertTo-Json -Depth 10) -notmatch "progress_percent") { throw "index_status no respondió" }
      - name: Registros
        if: always()
        shell: powershell
        run: Get-ChildItem "$env:ProgramData\Hound\logs" | ForEach-Object { "== $_"; Get-Content $_.FullName -Tail 80 }
      - name: Desinstalar
        shell: powershell
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          sc.exe stop Hound | Out-Null
          while ((Get-Service Hound).Status -ne "Stopped" -and $sw.Elapsed.TotalSeconds -lt 60) { Start-Sleep -Milliseconds 250 }
          "Parada del servicio: $([int]$sw.Elapsed.TotalSeconds) s"
          if ((Get-Service Hound).Status -ne "Stopped") {
            Get-CimInstance Win32_Process | Where-Object { $_.Name -match "python|WinSW|HoundService" } | Format-Table ProcessId, ParentProcessId, CommandLine -AutoSize -Wrap
            Get-ChildItem "$env:ProgramData\Hound\logs" | ForEach-Object { "== $_"; Get-Content $_.FullName -Tail 30 }
            throw "El servicio no se ha parado"
          }
          if ($sw.Elapsed.TotalSeconds -gt 15) { throw "El servicio tarda demasiado en pararse" }
          .\uninstall.ps1 -Purge

  installer-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar con install.sh (desde el código del commit)
        run: |
          sudo mkdir -p /srv/compartido/Obras /srv/compartido/RRHH
          echo "Presupuesto de la reforma de la cocina" | sudo tee /srv/compartido/Obras/presupuesto.txt
          echo "Nomina de marzo de la reforma de personal" | sudo tee /srv/compartido/RRHH/nomina.txt
          sudo chmod 700 /srv/compartido/RRHH
          sudo ./install.sh --share /srv/compartido --source "$PWD" --allow-from 10.8.0.0/24
      - name: Comprobar el servicio, el MCP y los permisos POSIX
        run: |
          systemctl is-active hound
          mcp() {
            curl -fsS http://127.0.0.1:8765/mcp -H "Authorization: Bearer $1" \
              -H "Accept: application/json, text/event-stream" -H "MCP-Protocol-Version: 2025-06-18" \
              -H "Content-Type: application/json" \
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/call\",\"params\":{\"name\":\"$2\",\"arguments\":$3}}"
          }
          TOKEN=$(sudo hound token create "$USER" --label ci | grep -o 'hound_[A-Za-z0-9_-]*' | head -n 1)
          for i in $(seq 1 30); do
            out=$(mcp "$TOKEN" index_status '{}'); echo "$out"
            echo "$out" | grep -q '\\"pending\\": 0' && echo "$out" | grep -q '\\"total\\": 2' && break
            sleep 5
          done
          sleep 15  # el servidor recarga el índice cada 10 s
          out=$(mcp "$TOKEN" search_files '{"query":"reforma"}'); echo "$out"
          echo "$out" | grep -q presupuesto.txt || { echo "La búsqueda no encontró el fichero"; exit 1; }
          # el usuario del runner no puede entrar en RRHH (700, de root): no debe ver la nómina
          if echo "$out" | grep -q nomina; then echo "Se ha filtrado un fichero sin permiso"; exit 1; fi
          sudo hound status
          sudo hound doctor
      - name: Registros
        if: always()
        run: sudo journalctl -u hound --no-pager -n 200
      - name: Desinstalar
        run: |
          sudo hound uninstall --purge -y
          if systemctl is-active --quiet hound; then echo "El servicio sigue activo"; exit 1; fi
          test ! -e /opt/hound && test ! -e /var/lib/hound && test ! -e /usr/local/bin/hound

  installer-distros:
    # Sin systemd en el contenedor: se prueba la instalación, el OCR, el modelo y una búsqueda.
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:22.04", "rockylinux:9"]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Herramientas mínimas
        run: |
          if command -v apt-get >/dev/null; then apt-get update -qq && apt-get install -y -qq curl ca-certificates tar gzip git
          else dnf install -y -q tar gzip git; fi
      - uses: actions/checkout@v4
      - name: Instalar con install.sh
        run: |
          mkdir -p /srv/compartido/Obras
          echo "Presupuesto de la reforma de la cocina" > /srv/compartido/Obras/presupuesto.txt
          ./install.sh --share /srv/compartido --source "$PWD" --no-service --no-firewall
      - name: Indexar y buscar
        run: |
          hound index
          hound search "reforma de la cocina" --as root | tee out.txt
          grep -q presupuesto.txt out.txt
          tesseract --list-langs 2>&1 | grep -qx spa
      - name: Desinstalar
        run: hound uninstall --purge -y && test ! -e /opt/hound
