[project]
name = "hound"
version = "0.1.0"
description = "Buscador semántico para carpetas compartidas de Windows Server, consultable por MCP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "uvicorn>=0.30",
    "starlette>=0.40",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "huggingface_hub>=0.24",
    "pypdfium2>=4.30",
    "pillow>=10.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "python-pptx>=1.0",
    "olefile>=0.47",
    "ezdxf>=1.3",
    "watchdog>=4.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4"]

[project.scripts]
hound = "hound.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hound"]

# Los desinstaladores van dentro del paquete para que "hound uninstall" funcione sin descargar nada.
[tool.hatch.build.targets.wheel.force-include]
"uninstall.ps1" = "hound/scripts/uninstall.ps1"
"uninstall.sh" = "hound/scripts/uninstall.sh"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
